version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    commit-message:
      # Runtime dependencies change the shipped package, so they release a patch;
      # development tools do not (ci never releases).
      prefix: build
      prefix-development: ci
    groups:
      dev-tools:
        dependency-type: development
